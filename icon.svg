<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ktema: Säulen zwischen Gebälk und Sockel, je 2 Einheiten Abstand; Balken und Sockel gleich breit; senkrecht und waagerecht mittig (Rand je 21 bzw. 20) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8be6"/>
      <stop offset="1" stop-color="#1d5fb3"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="20" y="21" width="60" height="7" rx="2" fill="#fff"/>
  <rect x="25" y="50" width="11" height="20" rx="2" fill="#fff" fill-opacity=".75"/>
  <rect x="44.5" y="40" width="11" height="30" rx="2" fill="#fff" fill-opacity=".88"/>
  <rect x="64" y="30" width="11" height="40" rx="2" fill="#fff"/>
  <rect x="20" y="72" width="60" height="7" rx="2" fill="#fff"/>
</svg>
